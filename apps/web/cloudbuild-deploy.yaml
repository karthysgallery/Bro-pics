# Runs on every push to the deploy branch (Cloud Build trigger "deploy-karthys-gallery").
# Test -> build image -> deploy to Cloud Run (service karthys-gallery, asia-south1), which
# Firebase Hosting (karthysgallery.in) serves. A failing test or build stops here, so a
# broken push never reaches the site.
#
# Run settings that are NOT in this file (service env vars such as SITE_PREVIEW and
# PAYMENT_PROVIDER, secrets, the service account) are kept by `gcloud run deploy`, so a push
# changes the code only. To go live: set _SITE_PREVIEW to 0 and _SITE_URL to the real
# address below, and set the matching env vars on the Cloud Run service.
#
# The Firebase web API key is public (it ships in the browser bundle) but is supplied by the
# trigger as _FIREBASE_API_KEY instead of living in the repository.
steps:
  - id: test
    name: node:20
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@9.12.0 --activate
        pnpm install --frozen-lockfile --filter "@bro-pics/web..."
        pnpm --filter @bro-pics/web exec tsc --noEmit
        pnpm --filter @bro-pics/web exec vitest run

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --network=cloudbuild
      - -f
      - apps/web/Dockerfile
      - --build-arg=GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --build-arg=SITE_PREVIEW=${_SITE_PREVIEW}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_WHATSAPP_NUMBER=${_WHATSAPP_NUMBER}
      - -t
      - ${_IMAGE}:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}:$SHORT_SHA"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --quiet

substitutions:
  _SERVICE: karthys-gallery
  _REGION: asia-south1
  _IMAGE: asia-south1-docker.pkg.dev/bropics-app/web/karthys-gallery
  # Preview mode: hidden from search engines, sign-in off. Flip to 0 only at go-live.
  _SITE_PREVIEW: "1"
  _SITE_URL: https://karthys-gallery-991383044884.asia-south1.run.app
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: bropics-app.firebaseapp.com
  _FIREBASE_STORAGE_BUCKET: bropics-app.firebasestorage.app
  _FIREBASE_MESSAGING_SENDER_ID: "991383044884"
  _FIREBASE_APP_ID: 1:991383044884:web:815e4f17eeba4e2201f801
  _WHATSAPP_NUMBER: "910000000000"

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
