# Runs on every push to the deploy branch (Cloud Build trigger "deploy-karthys-gallery").
# Test -> build image -> deploy to Cloud Run (service karthys-gallery, asia-south1), which
# Firebase Hosting (karthysgallery.in) serves. A failing test or build stops here, so a
# broken push never reaches the site.
#
# Run settings that are NOT in this file (service env vars such as SITE_PREVIEW and
# PAYMENT_PROVIDER, secrets, the service account) are kept by `gcloud run deploy`, so a push
# changes the code only. To go live: set _SITE_PREVIEW to 0 and _SITE_URL to the real
# address below, and set the matching env vars on the Cloud Run service.
#
# The Firebase web API key is public (it ships in the browser bundle) but is supplied by the
# trigger as _FIREBASE_API_KEY instead of living in the repository.
steps:
  - id: test
    name: node:20
    entrypoint: bash
    args:
      - -ceu
      - |
        corepack enable
        corepack prepare pnpm@9.12.0 --activate
        pnpm install --frozen-lockfile --filter "@bro-pics/web..."
        pnpm --filter @bro-pics/web exec tsc --noEmit
        pnpm --filter @bro-pics/web exec vitest run

  # Skew protection: a visitor whose page was opened before this deploy still asks for the previous build's
  # scripts and styles (hashed names under /_next/static). Without them, the next click showed an unstyled page or
  # the error page. So the scripts, styles and fonts of the image that is live now are copied into this build and
  # kept 3 days (pages are never cached longer than an hour: expireTime in next.config.ts).
  # - Only an image from this project's own repository is used.
  # - Off switch: set _KEEP_PREVIOUS_STATIC to "0" on the trigger (e.g. to drop old client code after a security fix).
  # - Any failure only means an empty folder: it never stops the deploy.
  - id: live-image
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -cu
      - |
        : > /workspace/live-image.txt
        if [ "${_KEEP_PREVIOUS_STATIC}" = "1" ]; then
          img=$$(gcloud run services describe ${_SERVICE} --region=${_REGION} --format='value(spec.template.spec.containers[0].image)' || true)
          case "$$img" in
            ${_IMAGE}:*|${_IMAGE}@sha256:*) echo "$$img" > /workspace/live-image.txt ;;
            *) echo "live image '$$img' is not from ${_IMAGE}: not carried over" ;;
          esac
        fi
        echo "live image: $$(cat /workspace/live-image.txt)"

  - id: previous-static
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -cu
      - |
        mkdir -p apps/web/previous-static
        img=$$(cat /workspace/live-image.txt 2>/dev/null || true)
        if [ -n "$$img" ] && docker pull -q "$$img" && cid=$$(docker create "$$img"); then
          docker cp "$$cid:/app/apps/web/.next/static/." /workspace/prev-raw/ || true
          docker rm "$$cid" > /dev/null || true
          # Only scripts, styles and fonts, and only files from the last 3 days.
          for d in chunks css media; do
            [ -d "/workspace/prev-raw/$$d" ] && cp -a "/workspace/prev-raw/$$d" apps/web/previous-static/ || true
          done
          find apps/web/previous-static -type f ! \( -name '*.js' -o -name '*.css' -o -name '*.woff2' -o -name '*.woff' \) -delete || true
          find apps/web/previous-static -type f -mtime +3 -delete || true
        fi
        echo "previous static files kept: $$(find apps/web/previous-static -type f | wc -l)"

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --network=cloudbuild
      - -f
      - apps/web/Dockerfile
      - --build-arg=GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --build-arg=SITE_PREVIEW=${_SITE_PREVIEW}
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=${_FIREBASE_API_KEY}
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${_FIREBASE_AUTH_DOMAIN}
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$PROJECT_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${_FIREBASE_STORAGE_BUCKET}
      - --build-arg=NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${_FIREBASE_MESSAGING_SENDER_ID}
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=${_FIREBASE_APP_ID}
      - --build-arg=NEXT_PUBLIC_WHATSAPP_NUMBER=${_WHATSAPP_NUMBER}
      - -t
      - ${_IMAGE}:$SHORT_SHA
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, "${_IMAGE}:$SHORT_SHA"]

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --quiet

substitutions:
  _SERVICE: karthys-gallery
  _REGION: asia-south1
  _IMAGE: asia-south1-docker.pkg.dev/bropics-app/web/karthys-gallery
  # LIVE since 2026-10-18: the site is public at karthysgallery.in. Set _SITE_PREVIEW to "1" (and the run.app URL) only to
  # close it again (hidden from search engines, sign-in off).
  _SITE_PREVIEW: "0"
  _SITE_URL: https://karthysgallery.in
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: bropics-app.firebaseapp.com
  _FIREBASE_STORAGE_BUCKET: bropics-app.firebasestorage.app
  _FIREBASE_MESSAGING_SENDER_ID: "991383044884"
  _FIREBASE_APP_ID: 1:991383044884:web:815e4f17eeba4e2201f801
  _WHATSAPP_NUMBER: "916369284351"
  # "1": keep the live build's scripts and styles in the new image for 3 days (see previous-static above).
  _KEEP_PREVIOUS_STATIC: "1"

options:
  # COST: E2_HIGHCPU_8 is a paid machine (about $0.0156 per build-minute: roughly ₹14 per push with GST). E2_STANDARD_2
  # is covered by the billing account's free 2,500 build-minutes a month (see cloud.google.com/build/pricing), so a push
  # costs nothing. It is slower; the timeout below allows for that. Do not switch back without checking the bill.
  machineType: E2_STANDARD_2
  logging: CLOUD_LOGGING_ONLY
timeout: 2400s
